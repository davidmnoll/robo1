name: Terraform Deploy (Dev)

on:
  push:
    branches:
      - dev
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-dev.yml'
      - 'api/**'
      - 'ros/**'
      - 'web/**'
  workflow_dispatch:

env:
  PROJECT_ID: robo1-489405
  TF_WORKING_DIR: terraform
  ENVIRONMENT: dev
  DEV_FRONTEND_BUCKET: robo1-489405-dev-frontend

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api_or_tf: ${{ steps.results.outputs.api_or_tf }}
      web: ${{ steps.results.outputs.web }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          list-files: none
          filters: |
            api_or_tf:
              - 'api/**'
              - 'ros/**'
              - 'terraform/**'
              - '.github/workflows/terraform-dev.yml'
            web:
              - 'web/**'

      - name: Set change outputs
        id: results
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_API_OR_TF: ${{ steps.filter.outputs.api_or_tf }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            API_OR_TF=true
            WEB=true
          else
            API_OR_TF=${FILTER_API_OR_TF:-false}
            WEB=${FILTER_WEB:-false}
          fi
          echo "api_or_tf=${API_OR_TF}" >> "${GITHUB_OUTPUT}"
          echo "web=${WEB}" >> "${GITHUB_OUTPUT}"

  terraform:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api_or_tf == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    outputs:
      api_url: ${{ steps.tf_outputs.outputs.api_url }}
      api_vm_name: ${{ steps.tf_outputs.outputs.api_vm_name }}
      api_vm_zone: ${{ steps.tf_outputs.outputs.api_vm_zone }}
      frontend_url: ${{ steps.tf_outputs.outputs.frontend_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TERRAFORM_TOKEN }}

      - name: Configure gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Ensure terraform state bucket exists
        run: |
          gsutil ls -b gs://robo1-terraform-state >/dev/null 2>&1 || \
            gsutil mb -p "${PROJECT_ID}" gs://robo1-terraform-state

      - name: Configure Docker auth for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push API image
        id: ensure_image
        env:
          IMAGE: gcr.io/${{ env.PROJECT_ID }}/robot-gateway:dev-${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Building API image ${IMAGE}..."
          docker build -t "${IMAGE}" ./api
          docker push "${IMAGE}"
          docker tag "${IMAGE}" "gcr.io/${PROJECT_ID}/robot-gateway:dev-latest"
          docker push "gcr.io/${PROJECT_ID}/robot-gateway:dev-latest"
          echo "TF_VAR_api_image=${IMAGE}" >> "${GITHUB_ENV}"
          echo "api_image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Extract CI service account email
        id: ci_sa
        run: |
          CI_SA_EMAIL=$(jq -r '.client_email' "${GOOGLE_APPLICATION_CREDENTIALS}")
          echo "email=${CI_SA_EMAIL}" >> "${GITHUB_OUTPUT}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - name: Terraform Init (Dev backend)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          # Reconfigure backend for dev environment
          terraform init -input=false -reconfigure \
            -backend-config="prefix=env/dev"

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Set CORS origins for dev
        id: cors
        run: |
          # Include GCS bucket URL and localhost origins
          CORS='["https://storage.googleapis.com","http://localhost:4173","http://localhost:5173"]'
          echo "TF_VAR_cors_allow_origins=${CORS}" >> "${GITHUB_ENV}"

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: us-central1
          TF_VAR_zone: us-central1-a
          TF_VAR_environment: dev
          TF_VAR_api_image: ${{ steps.ensure_image.outputs.api_image }}
          TF_VAR_ci_service_account_email: ${{ steps.ci_sa.outputs.email }}
          TF_VAR_db_deletion_protection: "false"

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: us-central1
          TF_VAR_zone: us-central1-a
          TF_VAR_environment: dev
          TF_VAR_api_image: ${{ steps.ensure_image.outputs.api_image }}
          TF_VAR_ci_service_account_email: ${{ steps.ci_sa.outputs.email }}
          TF_VAR_db_deletion_protection: "false"

      - name: Capture Terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          API_URL=$(terraform output -raw api_url)
          VM_NAME=$(terraform output -raw api_vm_name)
          VM_ZONE=$(terraform output -raw api_vm_zone)
          FRONTEND_URL=$(terraform output -raw frontend_url || echo "")
          echo "Captured API URL: ${API_URL}"
          echo "Captured VM Name: ${VM_NAME}"
          echo "Captured VM Zone: ${VM_ZONE}"
          echo "api_url=${API_URL}" >> "${GITHUB_OUTPUT}"
          echo "api_vm_name=${VM_NAME}" >> "${GITHUB_OUTPUT}"
          echo "api_vm_zone=${VM_ZONE}" >> "${GITHUB_OUTPUT}"
          echo "frontend_url=${FRONTEND_URL}" >> "${GITHUB_OUTPUT}"

      - name: Deploy API container via SSH
        env:
          API_VM_NAME: ${{ steps.tf_outputs.outputs.api_vm_name }}
          API_VM_ZONE: ${{ steps.tf_outputs.outputs.api_vm_zone }}
          IMAGE: ${{ steps.ensure_image.outputs.api_image }}
        run: |
          set -euo pipefail
          echo "Deploying ${IMAGE} to ${API_VM_NAME} in ${API_VM_ZONE}..."
          # Retry loop to handle IAM propagation delays
          for i in $(seq 1 5); do
            if gcloud compute ssh "${API_VM_NAME}" \
                --project="${PROJECT_ID}" \
                --zone="${API_VM_ZONE}" \
                --tunnel-through-iap \
                --command="sudo docker pull ${IMAGE} && sudo docker rm -f robot-gateway 2>/dev/null || true && sudo docker run -d --name robot-gateway --network host --restart=always --memory=2560m --memory-swap=2560m --env-file /etc/robot-gateway/env ${IMAGE}"; then
              echo "Deploy succeeded on attempt ${i}"
              exit 0
            fi
            echo "Attempt ${i}/5 failed, waiting 30s..."
            sleep 30
          done
          echo "Deploy failed after 5 attempts" >&2
          exit 1

      - name: Verify API health
        env:
          API_URL: ${{ steps.tf_outputs.outputs.api_url }}
        run: |
          set -euo pipefail
          HEALTH_URL="${API_URL%/}/api/health"
          echo "Waiting for API at ${HEALTH_URL}..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${HEALTH_URL}" 2>/dev/null || true)
            if [ "${STATUS}" = "200" ]; then
              echo "API is healthy (attempt ${i})"
              exit 0
            fi
            echo "Attempt ${i}/30: status=${STATUS}, retrying in 5s..."
            sleep 5
          done
          echo "API failed to become healthy after 150s" >&2
          exit 1

  deploy_frontend:
    runs-on: ubuntu-latest
    needs:
      - changes
      - terraform
    if: (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
        (needs.changes.outputs.web == 'true' || needs.changes.outputs.api_or_tf == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TERRAFORM_TOKEN }}

      - name: Configure gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - name: Fetch API URL
        id: fetch_url
        env:
          TERRAFORM_OUTPUT_URL: ${{ needs.terraform.outputs.api_url }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          if [ -n "${TERRAFORM_OUTPUT_URL}" ]; then
            echo "Using API URL from terraform job: ${TERRAFORM_OUTPUT_URL}"
            echo "GATEWAY_URL=${TERRAFORM_OUTPUT_URL}" >> "${GITHUB_ENV}"
            echo "gateway_url=${TERRAFORM_OUTPUT_URL}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "Terraform job was skipped, fetching URL from state..."
          terraform init -input=false -reconfigure -backend-config="prefix=env/dev" >/dev/null
          GATEWAY_URL=$(terraform output -raw api_url)
          echo "Fetched API URL from state: ${GATEWAY_URL}"
          echo "GATEWAY_URL=${GATEWAY_URL}" >> "${GITHUB_ENV}"
          echo "gateway_url=${GATEWAY_URL}" >> "${GITHUB_OUTPUT}"

      - name: Install dashboard dependencies
        working-directory: web
        run: npm ci

      - name: Build dashboard for GCS
        working-directory: web
        env:
          GATEWAY_URL: ${{ steps.fetch_url.outputs.gateway_url }}
        run: |
          set -euo pipefail
          if [ -z "${GATEWAY_URL:-}" ]; then
            echo "Gateway URL missing; cannot build dashboard" >&2
            exit 1
          fi
          # Validate URL format
          if [[ "${GATEWAY_URL}" != https://*.sslip.io ]]; then
            echo "Warning: Gateway URL doesn't match expected format (https://*.sslip.io)"
            echo "Got: ${GATEWAY_URL}"
          fi
          API_BASE="${GATEWAY_URL%/}/api"
          echo "Building dashboard with API base: ${API_BASE}"
          VITE_API_BASE_URL="${API_BASE}" npm run build

      - name: Upload to GCS bucket
        run: |
          set -euo pipefail
          echo "Uploading frontend to gs://${DEV_FRONTEND_BUCKET}/"
          # no-cache: GCS defaults public objects to max-age=3600, which leaves
          # browsers on an up-to-hour-stale dashboard after every deploy.
          gsutil -m -h "Cache-Control:no-cache, max-age=0" rsync -r -d web/dist "gs://${DEV_FRONTEND_BUCKET}/"
          gsutil -m setmeta -h "Cache-Control:no-cache, max-age=0" "gs://${DEV_FRONTEND_BUCKET}/**" || true
          echo ""
          echo "Frontend deployed to: https://storage.googleapis.com/${DEV_FRONTEND_BUCKET}/index.html"
