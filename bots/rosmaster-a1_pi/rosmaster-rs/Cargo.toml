[package]
name = "rosmaster"
version = "0.1.0"
edition = "2021"
description = "Rust driver for Yahboom Rosmaster robot control board"
license = "MIT"

[dependencies]
serialport = "4.3"
thiserror = "1.0"
parking_lot = "0.12"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3"

[[bin]]
name = "test_rosmaster"
path = "src/bin/test_rosmaster.rs"
