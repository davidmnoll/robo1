<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Lobby</title>
    <style>
      :root {
        font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        font-weight: 400;
        color-scheme: dark;
        color: #f8fafc;
        background-color: #0f172a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #app {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      /* Sidebar */
      .sidebar {
        width: 280px;
        background: #1e293b;
        border-right: 1px solid #334155;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .sidebar-header {
        padding: 1rem;
        border-bottom: 1px solid #334155;
      }
      .sidebar-header h1 {
        font-size: 1.2rem;
        font-weight: 600;
      }
      .sidebar-content {
        flex: 1;
        padding: 1rem;
        overflow-y: auto;
      }
      .tool-section {
        margin-bottom: 1.5rem;
      }
      .tool-section h3 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
        margin-bottom: 0.5rem;
      }
      .tool-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .tool-btn {
        padding: 0.5rem 1rem;
        background: #334155;
        border: 1px solid #475569;
        border-radius: 6px;
        color: #f8fafc;
        cursor: pointer;
        font-size: 0.875rem;
        transition: all 0.15s;
      }
      .tool-btn:hover {
        background: #475569;
      }
      .tool-btn.active {
        background: #3b82f6;
        border-color: #60a5fa;
      }
      /* Main content */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .toolbar {
        height: 48px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        padding: 0 1rem;
        gap: 1rem;
      }
      .toolbar input {
        padding: 0.5rem;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 4px;
        color: #f8fafc;
        font-size: 0.875rem;
      }
      .toolbar button {
        padding: 0.5rem 1rem;
        background: #3b82f6;
        border: none;
        border-radius: 4px;
        color: white;
        cursor: pointer;
        font-size: 0.875rem;
      }
      .toolbar button:hover {
        background: #2563eb;
      }
      /* Canvas area */
      .canvas-container {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      #editor-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
      }
      #renderer-canvas {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 320px;
        height: 240px;
        border: 2px solid #334155;
        border-radius: 8px;
        background: black;
      }
      /* Status bar */
      .status-bar {
        height: 28px;
        background: #1e293b;
        border-top: 1px solid #334155;
        display: flex;
        align-items: center;
        padding: 0 1rem;
        font-size: 0.75rem;
        color: #64748b;
        gap: 2rem;
      }
      .status-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
      }
      .status-dot.connected {
        background: #22c55e;
      }
      /* Players list */
      .players-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .player-item {
        padding: 0.5rem;
        background: #334155;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .player-color {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }
      .player-name {
        flex: 1;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="sidebar">
        <div class="sidebar-header">
          <h1>Virtual Lobby</h1>
        </div>
        <div class="sidebar-content">
          <div class="tool-section">
            <h3>Connection</h3>
            <input type="text" id="lobby-key" placeholder="Lobby Key" style="width:100%;margin-bottom:0.5rem;">
            <button id="connect-btn" class="tool-btn" style="width:100%;">Connect</button>
          </div>
          <div class="tool-section">
            <h3>Tools</h3>
            <div class="tool-buttons">
              <button class="tool-btn active" data-tool="select">Select</button>
              <button class="tool-btn" data-tool="wall">Wall</button>
              <button class="tool-btn" data-tool="fruit">Fruit</button>
              <button class="tool-btn" data-tool="note">Note</button>
            </div>
          </div>
          <div class="tool-section">
            <h3>Virtual Players</h3>
            <div id="players-list" class="players-list">
              <div class="player-item" style="color:#64748b;font-style:italic;">
                No players yet
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="main-content">
        <div class="toolbar">
          <span>Zoom:</span>
          <input type="range" id="zoom-slider" min="0.5" max="3" step="0.1" value="1">
          <span id="zoom-label">100%</span>
          <button id="reset-view">Reset View</button>
        </div>
        <div class="canvas-container">
          <canvas id="editor-canvas"></canvas>
          <canvas id="renderer-canvas"></canvas>
        </div>
        <div class="status-bar">
          <div class="status-item">
            <div class="status-dot" id="connection-status"></div>
            <span id="connection-label">Disconnected</span>
          </div>
          <div class="status-item">
            <span>Elements: <span id="element-count">0</span></span>
          </div>
          <div class="status-item">
            <span>Players: <span id="player-count">0</span></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
