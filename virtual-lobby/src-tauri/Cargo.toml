[package]
name = "virtual-lobby"
version = "0.1.0"
edition = "2021"
description = "Virtual Lobby - 3D sandbox for virtual players"
authors = ["Robot Gateway"]
license = "MIT"
repository = ""

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.6", features = [] }
tauri-plugin-shell = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
url = "2"
